name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pick the next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[].labels[].name] | join(",")')
          prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'length')
          if [ "$prs" = 0 ]; then
            echo "No pull request for $GITHUB_SHA, not releasing."
            exit 0
          fi
          case ",$labels," in
            *,no-release,*)
              echo "Labelled no-release, not releasing."
              exit 0
              ;;
          esac
          latest=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "tag=$(scripts/next-version.sh "$latest" "$labels")" >> "$GITHUB_OUTPUT"
      - name: Tag
        if: steps.version.outputs.tag != ''
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - uses: goreleaser/goreleaser-action@v6
        if: steps.version.outputs.tag != ''
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
